<tf-shell active="" title="Something went wrong">
  <div class="mx-auto flex max-w-md flex-col items-center py-16 text-center">
    <span class="inline-flex size-12 items-center justify-center rounded-xl bg-destructive/10 text-destructive"><tf-icon name="alert" class="size-6"></tf-icon></span>
    <h2 class="mt-4 text-lg font-semibold">This page didn't load</h2>
    <p class="mt-2 text-sm text-muted-foreground">The server took too long to answer. Your work is saved. Try again, or check the connection if it keeps happening.</p>
    <div class="mt-5 flex gap-2">
      <button class="inline-flex h-9 items-center gap-1.5 rounded-md bg-primary px-4 text-sm font-medium text-primary-foreground hover:bg-primary/90"><tf-icon name="refresh" class="size-4"></tf-icon>Try again</button>
      <a href="/overview" class="inline-flex h-9 items-center rounded-md border border-border px-4 text-sm hover:bg-accent">Go to overview</a>
    </div>
    <p class="mt-6 font-mono text-xs text-muted-foreground">Request 7f3a2c, 504 from api.taskflow</p>
  </div>
</tf-shell>
