<tf-shell active="account" title="Account">
  <div class="max-w-3xl">
    <tf-account-nav active="invitations"></tf-account-nav>
    <div class="mt-16 flex flex-col items-center text-center">
      <span class="grid size-12 place-items-center rounded-full bg-muted text-muted-foreground"><tf-icon name="mail-open" class="size-5"></tf-icon></span>
      <h2 class="mt-4 font-medium text-foreground">No invitations</h2>
      <p class="mt-1 max-w-sm text-sm text-muted-foreground">When someone adds you to their project, it shows up here. To work with someone, invite them to one of yours.</p>
      <a href="/invites" class="mt-5 inline-flex h-9 items-center rounded-md border border-border bg-background px-4 text-sm font-medium text-foreground hover:bg-accent">Invite people to a project</a>
    </div>
  </div>
</tf-shell>
