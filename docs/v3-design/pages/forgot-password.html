<div class="min-h-dvh bg-background">
  <tf-public-nav variant="auth" auth="login"></tf-public-nav>

  <main id="main" class="mx-auto w-full max-w-md px-5 pb-20 pt-10 lg:pt-20">
    <h1 class="text-3xl font-semibold tracking-tight text-foreground">Reset your password</h1>
    <p class="mt-2 text-muted-foreground">Enter the email you signed up with. We'll send a link that works for 30 minutes.</p>

    <form class="mt-8 space-y-5" action="/forgot-password--sent" novalidate>
      <div>
        <label for="email" class="text-sm font-medium text-foreground">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" inputmode="email" required placeholder="you@example.com" class="mt-2 block h-11 w-full rounded-md border border-input bg-background px-3 text-base text-foreground focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-ring" />
      </div>
      <a href="/forgot-password--sent" class="inline-flex h-11 w-full items-center justify-center rounded-md bg-primary px-5 text-sm font-medium text-primary-foreground hover:bg-primary/90 active:translate-y-px focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ring">Send reset link</a>
    </form>
    <p class="mt-8 text-sm text-muted-foreground">Remembered it? <a href="/login" class="font-medium text-link underline underline-offset-4 hover:decoration-2">Back to log in</a></p>
  </main>
</div>
