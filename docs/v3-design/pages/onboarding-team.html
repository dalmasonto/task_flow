<div class="min-h-dvh bg-background">
  <div class="mx-auto flex h-16 w-full max-w-3xl items-center justify-between px-5">
    <a href="/" class="font-semibold tracking-tight text-foreground">TaskFlow</a>
    <a href="/home" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:text-foreground">Skip setup</a>
  </div>

  <main id="main" class="mx-auto w-full max-w-3xl px-5 pb-20 pt-6">
    <h1 class="text-3xl font-semibold tracking-tight text-foreground">Who will use TaskFlow?</h1>
    <p class="mt-2 text-muted-foreground">This decides who can see your projects, and which licence applies. You can add a team later.</p>

    <fieldset class="mt-8">
      <legend class="sr-only">Who will use TaskFlow</legend>
      <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
        <label class="flex cursor-pointer gap-3 rounded-xl border border-border bg-card p-5 hover:bg-accent/50 focus-within:outline-2 focus-within:outline-ring">
          <input type="radio" name="who" class="sr-only" />
          <tf-icon name="user" class="mt-0.5 size-5 shrink-0 text-muted-foreground"></tf-icon>
          <span><span class="block font-medium text-card-foreground">Just me</span><span class="mt-1 block text-sm text-muted-foreground">You and your agents. Projects live in your personal space.</span></span>
        </label>
        <label class="flex cursor-pointer gap-3 rounded-xl border border-primary bg-primary/5 p-5 ring-1 ring-primary focus-within:outline-2 focus-within:outline-ring">
          <input type="radio" name="who" class="sr-only" checked />
          <tf-icon name="users" class="mt-0.5 size-5 shrink-0 text-foreground"></tf-icon>
          <span><span class="block font-medium text-card-foreground">A team</span><span class="mt-1 block text-sm text-muted-foreground">An organisation with shared projects, people, agents and one budget.</span></span>
        </label>
      </div>
    </fieldset>

    <form class="mt-6 space-y-5 rounded-xl border border-border bg-card p-5" action="/onboarding">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        <div class="min-w-0"><label for="org-name" class="text-sm font-medium text-foreground">Organisation name</label><input id="org-name" type="text" autocomplete="organization" value="Supercode Hive" class="mt-2 block h-10 w-full rounded-md border border-input bg-background px-3 text-base sm:text-sm" /></div>
        <div class="min-w-0"><label for="org-invite" class="text-sm font-medium text-foreground">Invite teammates <span class="font-normal text-muted-foreground">Optional</span></label><input id="org-invite" type="email" multiple placeholder="name@example.com, another@example.com" class="mt-2 block h-10 w-full rounded-md border border-input bg-background px-3 text-base sm:text-sm" /></div>
      </div>
      <fieldset>
        <legend class="text-sm font-medium text-foreground">What will the team use it for?</legend>
        <div class="mt-2 space-y-2">
          <label class="flex items-start gap-2.5 text-sm"><input type="radio" name="use" checked class="mt-1 accent-primary" /><span><span class="text-foreground">Personal, research or open-source work we don't sell</span><span class="block text-muted-foreground">Free under the noncommercial licence.</span></span></label>
          <label class="flex items-start gap-2.5 text-sm"><input type="radio" name="use" class="mt-1 accent-primary" /><span><span class="text-foreground">Work for a business or paying clients</span><span class="block text-muted-foreground">Needs a commercial licence. You can start now and request it from the organisation's Licence page.</span></span></label>
        </div>
      </fieldset>
      <div class="flex items-center justify-between gap-3 border-t border-border pt-4">
        <a href="/signup" class="rounded-md px-3 py-2 text-sm text-muted-foreground hover:text-foreground">Back</a>
        <a href="/onboarding" class="inline-flex h-11 items-center rounded-md bg-primary px-5 text-sm font-medium text-primary-foreground hover:bg-primary/90">Create organisation</a>
      </div>
    </form>
  </main>
</div>
