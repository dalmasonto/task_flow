<div class="min-h-dvh bg-background">
  <tf-public-nav variant="auth" auth="login"></tf-public-nav>

  <main id="main" class="mx-auto w-full max-w-md px-5 pb-20 pt-10 lg:pt-20">
    <span class="grid size-11 place-items-center rounded-full bg-muted text-foreground"><tf-icon name="mail-check" class="size-5"></tf-icon></span>
    <h1 class="mt-5 text-3xl font-semibold tracking-tight text-foreground">Check your email</h1>
    <p class="mt-2 text-muted-foreground" role="status">If <span class="font-medium text-foreground">dalmas@example.com</span> has an account, a reset link is on its way. It works for 30 minutes.</p>
    <div class="mt-8 rounded-lg border border-border bg-card p-4 text-sm text-muted-foreground">
      <p class="font-medium text-foreground">Nothing after a few minutes?</p>
      <p class="mt-1">Look in spam, or check the address and send again.</p>
      <div class="mt-3 flex flex-wrap gap-2">
        <button type="button" class="inline-flex h-9 items-center rounded-md border border-border bg-background px-3 text-sm font-medium text-foreground hover:bg-accent">Send again</button>
        <a href="/forgot-password" class="inline-flex h-9 items-center rounded-md px-3 text-sm font-medium text-foreground hover:bg-accent">Use a different email</a>
      </div>
    </div>
    <p class="mt-8 text-sm text-muted-foreground"><a href="/login" class="font-medium text-link underline underline-offset-4 hover:decoration-2">Back to log in</a></p>
  </main>
</div>
