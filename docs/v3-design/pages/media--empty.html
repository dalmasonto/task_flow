<tf-shell active="media" title="Media">

    <span class="grid size-12 place-items-center rounded-full bg-muted text-muted-foreground"><tf-icon name="images" class="size-5"></tf-icon></span>
    <h2 class="mt-4 text-lg font-medium text-foreground">No files yet</h2>

  </div>
