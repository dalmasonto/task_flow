[dependencies.ammonia]
version = "4"

[dependencies.async-trait]
version = "0.1"

[dependencies.axum]
version = "0.8"

[dependencies.base64]
version = "0.22"

[dependencies.bytes]
version = "1"

[dependencies.chrono]
version = "0.4"
features = ["serde"]

[dependencies.chrono-tz]
version = "0.10"

[dependencies.clap]
version = "4"
features = [
    "derive",
    "string",
]

[dependencies.crypto_box]
version = "0.9"
features = ["std"]

[dependencies.dotenvy]
version = "0.15"

[dependencies.figment]
version = "0.10"
features = [
    "env",
    "toml",
]

[dependencies.futures-util]
version = "0.3"
features = ["std"]
default-features = false

[dependencies.http]
version = "1"

[dependencies.inventory]
version = "0.3"

[dependencies.ipnetwork]
version = "0.20"
features = ["serde"]

[dependencies.mac_address]
version = "1"
features = ["serde"]

[dependencies.minijinja]
version = "2"

[dependencies.multer]
version = "3"

[dependencies.pulldown-cmark]
version = "0.12"
features = ["html"]
default-features = false

[dependencies.rand_core]
version = "0.6"
features = ["getrandom"]

[dependencies.regex]
version = "1"

[dependencies.rust_decimal]
version = "1"
features = ["serde-with-str"]
default-features = false

[dependencies.sea-query]
version = "0.32"
features = [
    "with-json",
    "with-ipnetwork",
    "with-mac_address",
    "with-rust_decimal",
]

[dependencies.sea-query-binder]
version = "0.7"
features = [
    "sqlx-sqlite",
    "sqlx-postgres",
    "with-chrono",
    "with-uuid",
    "with-json",
    "with-ipnetwork",
    "with-mac_address",
    "with-rust_decimal",
]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.serde_urlencoded]
version = "0.7"

[dependencies.sha2]
version = "0.10"

[dependencies.sqlx]
version = "0.8"
features = [
    "sqlite",
    "postgres",
    "any",
    "runtime-tokio",
    "chrono",
    "uuid",
    "json",
    "ipnetwork",
    "mac_address",
    "rust_decimal",
]

[dependencies.syntect]
version = "5"
features = ["default-fancy"]
default-features = false

[dependencies.tokio]
version = "1"
features = [
    "rt-multi-thread",
    "sync",
    "signal",
]

[dependencies.toml]
version = "0.8"

[dependencies.tower]
version = "0.5"
default-features = false

[dependencies.tower-http]
version = "0.6"
features = [
    "catch-panic",
    "cors",
    "fs",
    "compression-gzip",
    "compression-br",
    "trace",
    "limit",
    "timeout",
