# Production stack for TaskFlow. The host Caddy fronts everything with TLS, so
# the containers publish ONLY to loopback (127.0.0.1) — never 0.0.0.0, which
# would expose them on the public IP (http://<ip>:10002) and bypass Caddy.
#
# - postgres : PostgreSQL 16, INTERNAL ONLY (no published ports).
# - migrate  : one-shot, applies migrations then exits (web waits for it).
# - web      : the Umbral backend on 127.0.0.1:10002 — REST API, SSE realtime,
#              admin, media. Host Caddy proxies api.taskflow.supercodehive.com.
# - frontend : the built v2_fe dist (synced to ../frontend by the deploy
#              workflow), served by a caddy FILE SERVER (no proxying) on
#              127.0.0.1:10003. Host Caddy proxies taskflow.supercodehive.com.
#
# The FE and API are therefore DIFFERENT ORIGINS (different subdomain + port):
# the backend must allow the FE origin via TASKFLOW_CORS_ALLOWED_ORIGINS (set
# in .prod.env, wired in main.rs). Session cookies still flow on media loads
# because both hosts share the site supercodehive.com (SameSite=Lax is
# site-scoped, not origin-scoped).
#
# The `web` image bakes .prod.env at BUILD time (the Dockerfile copies it to
# /app/.env), so `web` needs no `env_file`. Postgres does — it reads its init
# credentials from the same decrypted .prod.env, which keeps ONE secret file
# instead of two that can drift apart.
#
# backend/.prod.env (decrypted from secret.env on deploy) must define:
#   POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB      # postgres init + healthcheck
#   UMBRAL_DATABASE_URL=postgres://USER:PASSWORD@postgres:5432/DB   # host = service name
#   UMBRAL_BIND_ADDR=0.0.0.0:10002                     # NOT 127.0.0.1
#   UMBRAL_ENVIRONMENT=prod
#   UMBRAL_ALLOWED_HOSTS=api.taskflow.supercodehive.com,taskflow.supercodehive.com,...
#   TASKFLOW_CORS_ALLOWED_ORIGINS=http://taskflow.supercodehive.com:10003
#   UMBRAL_SECRET_KEY                                  # secrets
# NB: UMBRAL_DATABASE_URL's USER/PASSWORD must match POSTGRES_USER/POSTGRES_PASSWORD.

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    env_file: .prod.env # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — postgres is reachable only inside the compose network.
    healthcheck:
      # `$$` -> a literal `$`, so the var expands inside the container, not here.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply pending migrations, then exit 0. `web` waits for it, so it
  # never races an unmigrated schema. Idempotent — safe on every deploy.
  #
  # Reuses the image `web` builds rather than building its own. `docker compose
  # up -d` alone would try to PULL taskflow-backend:latest, so the deploy runs
  # `docker compose build` first (see the deploy workflow).
  migrate:
    image: taskflow-backend:latest
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  web:
    build:
      context: .
      args:
        ENV_FILE: .prod.env
    image: taskflow-backend:latest
    command: ["serve"]
    environment:
      # The host Caddy is the one reverse proxy in front of :10002, so the real
      # client IP is the last X-Forwarded-For entry. With 0 every anonymous
      # caller shares one throttle bucket. A real env var beats the baked .env.
      UMBRAL_TRUSTED_PROXY_HOPS: "1"
      # Design screenshots: the backend shells out to renderer/client.sh, which
      # asks the `renderer` sidecar for the PNG. The sidecar loads sandbox
      # pages through the public API host, the same origin browsers use.
      TASKFLOW_DESIGN_BASE_URL: https://api.taskflow.supercodehive.com
      TASKFLOW_DESIGN_RENDERER: /usr/local/bin/design-render
      DESIGN_RENDERER_URL: http://renderer:3000
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      # Published on ALL interfaces by design — there is no proxy in front.
      # TLS is therefore not terminated anywhere for this port; see the deploy
      # notes before putting real secrets behind plain HTTP.
      - "127.0.0.1:10002:10002"
    volumes:
      # Uploaded attachments live here. A named volume, not an image layer:
      # without it, every `docker compose build` would silently discard
      # everything users uploaded.
      - media:/app/media
    healthcheck:
      # The Host header is NOT incidental. In `prod`, the framework mounts a
      # host guard that 400s any request whose Host is absent from
      # UMBRAL_ALLOWED_HOSTS. A plain `curl localhost:10002` sends
      # `Host: localhost:10002` — allowed only because localhost is also in
      # UMBRAL_ALLOWED_HOSTS; sending the real host exercises the production
      # path instead.
      test:
        ["CMD", "curl", "-fsS", "-H", "Host: api.taskflow.supercodehive.com", "http://127.0.0.1:10002/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s # first boot applies migrations before serving
    restart: unless-stopped

  # Object storage (S3-compatible) for static assets (public `taskflow-static`
  # bucket) and media (private `taskflow-media`, served to browsers as short-TTL
  # presigned URLs). Loopback ports ONLY — host Caddy fronts TLS:
  # s3.taskflow.supercodehive.com -> :9000 (S3 API + public assets),
  # minio.taskflow.supercodehive.com -> :9001 (admin console). Creds + the two
  # MINIO_*_URL vars come from .prod.env (see its `MinIO / S3` section).
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: .prod.env # MINIO_ROOT_USER/PASSWORD, MINIO_SERVER_URL, MINIO_BROWSER_REDIRECT_URL
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  # Static file server for the built v2_fe dist — a file server, NOT a proxy.
  # The deploy workflow syncs the dist to /home/taskflow/frontend (= ../frontend
  # relative to this compose file). frontend.Caddyfile adds the SPA fallback:
  # unknown paths rewrite to /index.html so client-side routes deep-link.
  frontend:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:10003:10003"
    volumes:
      - ../frontend:/srv:ro
      - ./frontend.Caddyfile:/etc/caddy/Caddyfile:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:10003/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Headless Chromium for design screenshots (renderer/). It renders
  # agent-authored HTML with --no-sandbox (the host kernel forbids Chromium's
  # own sandbox), so the container is the boundary: no secrets, no volumes,
  # no published port, read-only root, every capability dropped.
  renderer:
    build: ./renderer
    image: taskflow-renderer:latest
    restart: unless-stopped
    init: true # node is PID 1; something has to reap Chromium's children
    environment:
      RENDER_ALLOWED_ORIGIN: https://api.taskflow.supercodehive.com
    read_only: true
    tmpfs:
      - /tmp:size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    shm_size: 256m
    mem_limit: 1g
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  media:
  minio_data:
