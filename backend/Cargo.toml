[package]
name = "backend"
version = "0.1.0"
edition = "2024"
# Two bins exist (backend + backup_media); keep `cargo run` = the app.
default-run = "backend"

# The plugins are workspace members, not just path dependencies. A path dep
# that is not a member cannot be tested with dev-dependencies ("package X
# cannot be tested because it requires dev-dependencies and is not a member
# of the workspace"), which is what a plugin's `tests/` directory needs.
[workspace]
members = ["plugins/*"]

# A library target alongside the binary, so integration tests in `tests/` can
# reach the wiring modules (`backend::realtime`). `main.rs` stays the binary
# and keeps its own `mod` declarations; only the modules that are worth
# testing from outside are re-exported here.
[lib]
name = "backend"
path = "src/lib.rs"

[dependencies]
taskflow-agents = { path = "plugins/taskflow-agents" }
taskflow-toolbox = { path = "plugins/taskflow-toolbox" }
taskflow-decisions = { path = "plugins/taskflow-decisions" }
taskflow-usage = { path = "plugins/taskflow-usage" }
taskflow-inbox = { path = "plugins/taskflow-inbox" }
taskflow-daily = { path = "plugins/taskflow-daily" }
taskflow-tasks = { path = "plugins/taskflow-tasks" }
taskflow-projects = { path = "plugins/taskflow-projects" }
taskflow-github = { path = "plugins/taskflow-github" }
# Design Surface: the agent-editable UI canvas (pages/components/tokens rows,
# validator, sandbox composer). See plugins/taskflow-design/src/lib.rs.
taskflow-design = { path = "plugins/taskflow-design" }
# #885: the Database tool (agent-written data model, editable by the human).
taskflow-db = { path = "plugins/taskflow-db" }

# ----- Framework core (always required) ------------------------------------
umbral         = "0.0.13"
umbral-cli     = "0.0.13"

# ----- Active by default ---------------------------------------------------
# What the generated `src/main.rs` wires in. Comment any of these out only
# if you also remove the matching `.plugin(...)` line.
umbral-auth     = "0.0.13"
umbral-sessions = "0.0.13"
umbral-admin    = "0.0.13"
umbral-rest     = "0.0.13"
umbral-openapi  = "0.0.13"
umbral-security = "0.0.13"
umbral-realtime = "0.0.13"
# OAuth / social login + account-linking (GitHub). Wired in main.rs; the
# taskflow-github plugin reads linked tokens from its SocialAccount model.
umbral-oauth    = "0.0.13"
# Observability init helper (structured JSON logging). Enable the `otel`
# feature to ALSO export OpenTelemetry traces over OTLP to a collector
# (Jaeger/Tempo/Honeycomb): `umbral-logs = { version = "0.0.13", features = ["otel"] }`.
umbral-logs     = "0.0.13"
# Serves ./static at /static — including the compiled Tailwind bundle this
# project ships. Not optional: the SecurityPlugin's CSP blocks third-party
# script/style CDNs, so an app must serve its own assets.
# `s3`: the S3Storage backend for `collectstatic --storage s3` and the
# `backup_media` bin (MinIO / R2 / S3 targets).
umbral-storage  = { version = "0.0.13", features = ["s3"] }

# ----- Available built-ins (uncomment + register in main.rs to enable) -----
umbral-playground   = "0.0.13"  # Interactive API playground UI (think mini-Postman) at /playground/.
# umbral-tasks        = "0.0.13"  # DB-backed background task queue with a worker process.
# umbral-permissions  = "0.0.13"  # ContentType + Group + Permission model.
# umbral-rls          = "0.0.13"  # Postgres row-level security policy registration.
# umbral-cache        = "0.0.13"  # Per-request caching helper.
# umbral-email        = "0.0.13"  # SMTP + MIME email composer + sender.
# umbral-signals      = "0.0.13"  # Pre/post save/delete signal dispatch.
# umbral-livereload   = "0.0.13"  # Dev-only browser live-reload (SSE push + file watcher). Add `.plugin(LiveReloadPlugin::new())`.

# ----- Third-party + framework runtime deps --------------------------------
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# #1124: read form-encoded register bodies the way umbral-auth 0.0.13 does.
serde_urlencoded = "0.7"
chrono = { version = "0.4", features = ["serde"] }
# #1134: opaque public ids for cookie sessions (never the session key).
sha2 = "0.10"
sqlx = { version = "0.8", features = ["macros", "sqlite", "postgres", "chrono", "runtime-tokio"] }
# The framework Middleware trait names axum's Request/Response types, so a
# custom middleware (see src/realtime_auth.rs, #41) needs axum directly.
axum = "0.8"

# Once you `umbral startapp <plugin>` or `umbral startplugin <plugin>`, add
# the plugin crate here:
# backend-posts = { path = "plugins/posts" }

# ----- Test-only deps ------------------------------------------------------
# Integration tests under `tests/` boot an in-process app and drive its router.
[dev-dependencies]
umbral-testing = "0.0.13"
axum           = "0.8"
http           = "1"

