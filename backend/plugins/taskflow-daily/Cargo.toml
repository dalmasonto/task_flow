[package]
name = "taskflow-daily"
version = "0.1.0"
edition = "2024"

[dependencies]
umbral = "0.0.13"
umbral-auth = "0.0.13"
taskflow-projects = { path = "../taskflow-projects" }
taskflow-tasks = { path = "../taskflow-tasks" }
taskflow-agents = { path = "../taskflow-agents" }
taskflow-decisions = { path = "../taskflow-decisions" }
taskflow-usage = { path = "../taskflow-usage" }
tokio = { version = "1", features = ["rt", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
tracing = "0.1"
async-trait = "0.1"

[dev-dependencies]
umbral-testing = "0.0.13"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
http = "1"
axum = "0.8"
