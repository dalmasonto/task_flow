[package]
name = "taskflow-toolbox"
version = "0.1.0"
edition = "2024"

[dependencies]
umbral = "0.0.10"
umbral-auth = "0.0.10"
taskflow-projects = { path = "../taskflow-projects" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
regex = "1"
# The install manifest records a content hash the MCP re-checks before running
# an installed script; sha256 keeps the name honest.
sha2 = "0.10"
taskflow-agents = { path = "../taskflow-agents" }

[dev-dependencies]
umbral-testing = "0.0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
http = "1"
