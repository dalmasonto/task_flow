[package]
name = "taskflow-agents"
version = "0.1.0"
edition = "2024"

[dependencies]
umbral = "0.0.10"
umbral-auth = "0.0.10"
taskflow-projects = { path = "../taskflow-projects" }
taskflow-tasks = { path = "../taskflow-tasks" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The send endpoint reads a raw request body (`axum::body::Bytes`) so it can
# branch on content-type between JSON and multipart/form-data.
axum = "0.8"
sqlx = { version = "0.8", features = ["sqlite", "postgres", "runtime-tokio", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
# API-key hashing: credentials store only sha256(raw_key), never the raw key.
sha2 = "0.10"
# Key material: prefix + secret are uuid-v4 (CSPRNG-backed) hex.
uuid = { version = "1", features = ["v4"] }
# The agent event stream registers directly with the realtime hub (the built-in
# SSE route authenticates users, and an agent credential is not a user).
umbral-realtime = "0.0.10"
tokio-stream = "0.1"
# Drop is sync but deregistration is async — the guard spawns onto the runtime.
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
umbral-testing = "0.0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `TestClient::set_default_header` takes `http` types; the tests send the
# bearer token that way.
http = "1"
